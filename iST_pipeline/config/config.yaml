  merscope_proseg:          {}


# ---------------------------------------------------------------------------
# 03_benchmarking — segmentation quality comparison
# ---------------------------------------------------------------------------
# Pre-computed summary metrics CSVs produced by the segmentation analysis
# workflow (external, not pipeline outputs). Their paths are flagged here so
# segmentation_quality.R can be run reproducibly without hardcoded paths.
# scrna_path: scGEM (10x scRNA-seq) reference used for negative marker purity.
# scrna_celltype_col: cell type column in the scRNA object (Bcell_subcluster_combined).
# celltype_col: cell type column in the annotated spatial Seurat objects.
# xenium_keep_samples: Sample IDs to retain from the Xenium metrics CSV
#   (batch34 regions only; these match the 'Sample' column in the CSV).
segmentation_comp:
  merscope_metrics_csv: /vast/projects/SpatialBench/analysis/segmentation_comparison/merscope_summary_metrics_merged_filtered_final.csv
  xenium_metrics_csv: /vast/projects/SpatialBench/analysis/segmentation_comparison/xenium_summary_metrics_merged_filtered.csv
  scrna_path: /vast/projects/SpatialBench/scGEM_subcluster/scGEM_seu.rds
  scrna_celltype_col: Bcell_subcluster_combined
  celltype_col: cell_type
  xenium_keep_samples:
    - 0032118__Region_1
    - 0032118__Region_2
    - 0032118__Region_3
    - 0032118__Region_4
    - 0032118__Region_5
