# Bin sizes in microns — one RDS is produced per sample per resolution
bin_resolutions:
  - 8
  - 16

# Minimum transcript quality value for inclusion (Xenium only)
mols_qv_threshold: 20

# Root output directory
output_dir: results


# ---------------------------------------------------------------------------
# 02_spatial_analysis parameters
# ---------------------------------------------------------------------------
spatial_analysis:

  # --- Sample sets ---
  # xenium_default_samples: 9 non-batch34 samples (batch24 + batch27) used for
  #   the xenium_default method (expression benchmarking, no cross-seg comparison).
  # xenium_batch34_samples: 5 batch34 samples shared across xenium_batch34_default,
  #   xenium_batch34_cellpose, and xenium_batch34_proseg (segmentation benchmarking).
  # Note: config["xenium"]["samples"] has 14 entries total; the two lists below
  #   select the relevant subsets explicitly.
  xenium_default_samples:
    - wt709_batch27
    - wt710_batch27
    - wt713_batch24
    - ctrl172_batch27
    - ctrl173_batch24
    - ctrl174_batch27
    - ko166_batch24
    - ko167_batch24
    - ko168_batch27

  xenium_batch34_samples:
    - wt709__batch34__0032118
    - wt710__batch34__0032118
    - ctrl172_batch34__0032118
    - ctrl173_batch34__0032118
    - ctrl174__batch34__0032118

  # MERSCOPE: 9 samples (shared across default, cellpose, proseg)
  merscope_samples:
    - wt709_batch13
    - wt710_batch13
    - wt713_batch13
    - ctrl172_batch10
    - ctrl173_batch9
    - ctrl174_batch6
    - ko166_batch6
    - ko167_batch10
    - ko168_batch9

  # --- Platform-specific settings ---
  # assay:         Seurat assay name used in QC, normalisation, and BANKSY
  # banksy_lambda: spatial weighting (0 = expression only, 1 = neighbourhood only)
  #                Xenium uses 0.3; MERSCOPE uses 0.4 (tuned in original analysis)
  platforms:
    xenium:
      assay: Xenium
      banksy_lambda: 0.3
    merscope:
      assay: Vizgen
      banksy_lambda: 0.4

  # Methods for which pseudobulk DE (KO vs WT) will be run.
  # Excludes xenium_batch34_* — those cohorts contain no KO samples.
  de_methods:
    - xenium_default
    - merscope_default
    - merscope_cellpose
    - merscope_proseg

  # --- Shared analysis parameters ---
  qc_min_counts: 6      # minimum transcripts per cell (strict greater-than)
  scale_factor: 10000   # LogNormalize scale factor
  banksy_k_geom: 12     # BANKSY geometric neighbourhood size
  npcs: 30              # PCA components computed on BANKSY features
  dims: 30              # dimensions used for Harmony, FindNeighbors, and UMAP
  resolution: 0.6       # Leiden clustering resolution
  umap_seed: 42         # UMAP random seed for reproducibility
  gc_dims: 15           # dimensions for GC B cell FindNeighbors and RunUMAP
  gc_resolution: 0.2    # Leiden resolution for GC B cell subclustering


# ---------------------------------------------------------------------------
# Cluster annotations — populate after inspecting embedded.rds UMAPs
# ---------------------------------------------------------------------------
# Maps cluster_harmony_sampleid (integer, as string key) -> cell type name.
# Example when filled in:
#   xenium_default:
#     "0": "GC B cells"
#     "1": "T cells"
#     "2": "Macrophages"
# Leave as empty mapping ({}) to run annotate_clusters.R in "Unannotated" mode.
# Cell type annotation confirmed with manual inspection of marker gene expression.

# ---------------------------------------------------------------------------
# Pseudobulk DE parameters
# ---------------------------------------------------------------------------
# KO vs WT limma-voom DE run on methods listed in spatial_analysis.de_methods.
# assay must match the platform's native Seurat assay name.

pseudobulk_de:
  cell_type_col: cell_type
  condition_col: condition
  animal_id_col: animal_id
  assay:
    xenium:   Xenium
    merscope: Vizgen
  min_reps: 2
  contrast_name: KovsWt
  keep_conditions:
    - wt
    - ko
  contrast_levels:
    - wt
    - ko


